spring.application.name=managementsystem

spring.datasource.url=jdbc:mysql://localhost:3306/english_center
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# schema is owned by Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.show-sql=false

app.invoice.generation-cron=0 0 1 1 * *

app.invoice.pro-rate-first-month=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expires-in-minutes=480

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000